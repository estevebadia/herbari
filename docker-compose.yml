services:
  web:
    image: ${NGINX_IMAGE}
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3001}:80
    restart: unless-stopped
    volumes:
    - ./docker/localhost.conf:/etc/nginx/conf.d/localhost.conf:ro
    - ./dist/spa:/usr/share/nginx/html:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
